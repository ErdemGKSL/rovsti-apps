[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
default-members = ["apps/*", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# One GPUI source per build: every gpui crate comes from the same gpui-fusion
# revision. d6c8412 (2026-10-25) ships the gpui_android backend and the
# gpui_icons Lucide set; liquid_glass_kit was verified on cc05989 and its
# shader test passes here. Bump all of them together.
[workspace.dependencies]
gpui = { git = "https://github.com/cradiy/gpui-fusion", rev = "d6c84124af8775db003b17c6393c3e38e1097ac5", default-features = false }
gpui_effects = { git = "https://github.com/cradiy/gpui-fusion", rev = "d6c84124af8775db003b17c6393c3e38e1097ac5" }
gpui_platform = { git = "https://github.com/cradiy/gpui-fusion", rev = "d6c84124af8775db003b17c6393c3e38e1097ac5", features = ["wayland"] }
gpui_android = { git = "https://github.com/cradiy/gpui-fusion", rev = "d6c84124af8775db003b17c6393c3e38e1097ac5" }
gpui_icons = { git = "https://github.com/cradiy/gpui-fusion", rev = "d6c84124af8775db003b17c6393c3e38e1097ac5", default-features = false, features = ["lucide-common", "lucide-connectivity", "lucide-editing", "lucide-media", "lucide-misc"] }
gpui_wgpu = { git = "https://github.com/cradiy/gpui-fusion", rev = "d6c84124af8775db003b17c6393c3e38e1097ac5" }

liquid_glass_kit = { path = "crates/liquid_glass_kit" }
rovsti_core = { path = "crates/rovsti_core" }
rovsti_ui = { path = "crates/rovsti_ui" }
rovsti_android = { path = "crates/rovsti_android" }
rovsti_geo = { path = "crates/rovsti_geo" }
rovsti_whatsapp = { path = "crates/rovsti_whatsapp" }
rovsti_wa_proto = { path = "crates/rovsti_wa_proto" }
rovsti_wa_client = { path = "crates/rovsti_wa_client" }

anyhow = "1"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
jni = "0.21.1"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Default features minus `simd`, which needs nightly (portable_simd).
whatsapp-rust = { version = "0.7", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }
naga = { version = "30", features = ["wgsl-in"] }

# gpui-fusion patches some crates.io dependencies. `[patch]` in a dependency is
# ignored, so the consuming workspace must repeat these lines (keep in sync
# with gpui-fusion's root Cargo.toml at the pinned revision).
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
calloop = { git = "https://github.com/zed-industries/calloop" }

[profile.dev]
# gpui debug builds are huge; keep dependency debuginfo light.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
# Small binary first, hot paths stay fast (see the per-package overrides).
# panic stays "unwind": gpui_android's JNI bridge catches panics with
# catch_unwind and reports them to Java instead of killing the process.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
incremental = false

# Rendering, layout and our own per-frame code keep full optimisation.
[profile.release.package.gpui]
opt-level = 3
[profile.release.package.gpui_wgpu]
opt-level = 3
[profile.release.package.gpui_android]
opt-level = 3
[profile.release.package.liquid_glass_kit]
opt-level = 3
[profile.release.package.rovsti_ui]
opt-level = 3
[profile.release.package.rovsti_core]
opt-level = 3
# The app's own per-frame code (building the element tree every frame).
[profile.release.package.rovsti_phone]
opt-level = 3
# Layout and text run on every frame that changes: taffy lays the tree out,
# cosmic-text shapes strings the line cache has not seen (a list scrolling in
# new rows), swash and zeno rasterise new glyphs, tiny-skia rasterises icons on
# first use. Measured on the desktop harness (docs/perf/glass-and-profile.md):
# 4 to 9% less scene-build time than leaving them at `s`.
[profile.release.package.taffy]
opt-level = 3
[profile.release.package.cosmic-text]
opt-level = 3
[profile.release.package.harfrust]
opt-level = 3
[profile.release.package.rustybuzz]
opt-level = 3
[profile.release.package.swash]
opt-level = 3
[profile.release.package.zeno]
opt-level = 3
[profile.release.package.tiny-skia]
opt-level = 3
