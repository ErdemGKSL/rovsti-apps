# Team / enterprise overrides for _bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.

# Chat with the user in English; every written artifact (docs, specs, stories, code) stays English.
[core]
communication_language = "English"
document_output_language = "English"
project_name = "rovsti-phone"
# Each app keeps its own BMAD workspace: apps/<app>/_bmad-output.
# ACTIVE APP: phone. To plan another app, change "phone" below (and
# project_name above) to "messages" or "stops"; nothing else moves.
output_folder = "{project-root}/apps/phone/_bmad-output"

[modules.bmm]
planning_artifacts = "{project-root}/apps/phone/_bmad-output/planning-artifacts"
implementation_artifacts = "{project-root}/apps/phone/_bmad-output/implementation-artifacts"
project_knowledge = "{project-root}/docs"
