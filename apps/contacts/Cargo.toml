[package]
name = "rovsti_contacts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rovsti Contacts: your address book in liquid glass, on the device only."

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
rovsti_android.workspace = true
rovsti_core.workspace = true
rovsti_ui.workspace = true
rovsti_wa_client.workspace = true
rovsti_wa_proto.workspace = true
rovsti_wa_ui.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
image = { workspace = true, features = ["jpeg", "webp"] }

[features]
# Headless screenshot tests (`docs/screenshots.md`). Never in release.
shots = ["rovsti_ui/shots"]

[target.'cfg(target_os = "android")'.dependencies]
gpui_android.workspace = true

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
qrcode.workspace = true
