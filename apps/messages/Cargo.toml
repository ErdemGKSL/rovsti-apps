shots = ["rosty_ui/shots"]

[target.'cfg(target_os = "android")'.dependencies]
gpui_android.workspace = true

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_wgpu.workspace = true
