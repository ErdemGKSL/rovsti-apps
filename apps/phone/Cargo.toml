[package]
name = "rovsti_phone"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rovsti Phone: liquid-glass dialer for Android."

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
rovsti_android.workspace = true
rovsti_core.workspace = true
rovsti_ui.workspace = true
log.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true

[features]
# Frame recorder and scripted scenarios (stories 12.1, 12.2). Never in release.
perf = ["rovsti_ui/perf"]

[target.'cfg(target_os = "android")'.dependencies]
gpui_android.workspace = true

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_wgpu.workspace = true
