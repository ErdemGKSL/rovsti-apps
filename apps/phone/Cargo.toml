[package]
name = "rosty_phone"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rosty Phone: liquid-glass dialer for Android."

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
rosty_android.workspace = true
rosty_app_core.workspace = true
rosty_core.workspace = true
rosty_ui.workspace = true
rosty_wa_client.workspace = true
rosty_wa_proto.workspace = true
rosty_wa_ui.workspace = true
log.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true

[features]
# Frame recorder and scripted scenarios (stories 12.1, 12.2). Never in release.
perf = ["rosty_ui/perf"]
# Headless screenshot tests (`docs/screenshots.md`). Never in release.
shots = ["rosty_ui/shots"]

[target.'cfg(target_os = "android")'.dependencies]
gpui_android.workspace = true

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_wgpu.workspace = true
