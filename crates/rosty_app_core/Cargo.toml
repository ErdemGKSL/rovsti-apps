[package]
name = "rosty_app_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "App-level logic of the four Rosty apps without UI or JNI."

[dependencies]
base64.workspace = true
log.workspace = true
rosty_core.workspace = true
rosty_geo.workspace = true
rosty_wa_client.workspace = true
rosty_wa_proto.workspace = true
# fallible_uint: u64 columns (event seq, sizes) convert with a checked cast.
rusqlite = { workspace = true, features = ["fallible_uint"] }
serde.workspace = true
# preserve_order: handlers answer with keys in insertion order, as the GPUI apps always did
# (feature unification turned it on there); the golden answers are byte-identical.
serde_json = { workspace = true, features = ["preserve_order"] }
takumi.workspace = true
thiserror.workspace = true

[dev-dependencies]
image.workspace = true

[lints]
workspace = true
