[package]
name = "rovsti_ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The only JNI library of the Kotlin apps: envelope, panic guard, handles, event sink, ops."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# core.panic and core.emit_test for Kotlin-side tests that load the host library.
test-ops = []

[dependencies]
base64.workspace = true
futures.workspace = true
jni.workspace = true
log.workspace = true
qrcode.workspace = true
rovsti_app_core.workspace = true
rovsti_core.workspace = true
rovsti_geo.workspace = true
rovsti_tiles.workspace = true
rovsti_wa_client.workspace = true
rovsti_wa_proto.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# A throwaway WebSocket server for the event and call-audio tests (the same features rovsti_wa_client builds with).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[lints]
workspace = true
