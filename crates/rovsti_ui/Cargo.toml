[package]
name = "rovsti_ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared liquid-glass components and app shell for the Rovsti apps."

[dependencies]
gpui.workspace = true
gpui_icons.workspace = true
liquid_glass_kit.workspace = true
log.workspace = true
rovsti_core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
gpui_android.workspace = true

[features]
# Frame diagnostics and the RovstiPerf recorder (story 12.1). Off in release.
perf = []

[lints]
workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
