[package]
name = "rovsti_wa_ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared WhatsApp settings screen for the Rovsti apps: link a new instance or connect to an existing one."

[dependencies]
gpui.workspace = true
rovsti_android.workspace = true
rovsti_app_core.workspace = true
rovsti_core.workspace = true
rovsti_ui.workspace = true
rovsti_wa_client.workspace = true
rovsti_wa_proto.workspace = true
futures.workspace = true
# JPEG and WebP: WhatsApp profile pictures (gpui already builds both).
image = { workspace = true, features = ["jpeg", "webp"] }
log.workspace = true
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
