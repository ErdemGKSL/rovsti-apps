[package]
name = "wa_gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Server that owns every WhatsApp session and serves the Rovsti apps over HTTP and WebSocket."

[features]
# Scripted in-memory driver, always on for tests.
fake = []

[dependencies]
async-channel.workspace = true
axum.workspace = true
env_logger.workspace = true
futures.workspace = true
getrandom.workspace = true
log.workspace = true
rovsti_wa_proto.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
toml.workspace = true
whatsapp-rust.workspace = true

[dev-dependencies]
rovsti_wa_client.workspace = true
tempfile = "3"
wa_gateway = { path = ".", features = ["fake"] }

[lints]
workspace = true
