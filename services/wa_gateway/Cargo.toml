[package]
name = "wa_gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Server that owns every WhatsApp session and serves the Rovsti apps over HTTP and WebSocket."

[features]
# Scripted in-memory driver, always on for tests.
fake = []

[dependencies]
async-channel.workspace = true
bytes = "1"
base64.workspace = true
axum.workspace = true
env_logger.workspace = true
futures.workspace = true
getrandom.workspace = true
log.workspace = true
ring = "0.17"
rovsti_wa_proto.workspace = true
rusqlite.workspace = true
rustls-pki-types = { version = "1", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
toml.workspace = true
ureq = { version = "3", features = ["json"] }
# `voip-mlow`: the pure-Rust MLOW codec. `voip-libopus`: libopus (the `opus` crate) for native
# Opus calls and for the Opus packets a peer sends inside MLOW. Without a system libopus
# (pkg-config) `audiopus_sys` builds the bundled copy with cmake, so the build host needs cmake.
whatsapp-rust = { workspace = true, features = ["voip-mlow", "voip-libopus"] }

[dev-dependencies]
rovsti_wa_client.workspace = true
tempfile = "3"
wa_gateway = { path = ".", features = ["fake"] }

[lints]
workspace = true
